<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>NearStop Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* One 16:9 stage (world camera + fixed HUD layer) on a dark projector surround; slim control bar beneath.
   Single committed look for projection: concrete floor, hi-vis yellow, signal red. */
:root {
  color-scheme: dark;
  --surround: #0c0f11;
  --bar: #161b1f;
  --bar-line: #2a3238;
  --text: #eef1f2;
  --muted: #9aa6ac;
  --hivis: #ffc20e;
  --red: #e2321f;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--surround); color: var(--text); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
#shell { max-width: 1400px; margin: 0 auto; display: grid; gap: 10px; }
#stageWrap { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 6px; overflow: hidden; }
#stageWrap svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#shell:fullscreen { max-width: none; width: 100vw; height: 100vh; padding: 0; background: #000; display: flex; align-items: center; justify-content: center; }
#shell:fullscreen #stageWrap { width: min(100vw, 177.78vh); border-radius: 0; }
#shell:fullscreen .bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(1100px, 94vw); opacity: 0; transition: opacity .3s; }
#shell:fullscreen .bar:hover, #shell:fullscreen.active .bar { opacity: 1; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--bar); border: 1px solid var(--bar-line); border-radius: 6px; padding: 8px; }
.btn { font: 600 .85rem var(--body); padding: 7px 12px; border-radius: 4px; border: 1px solid var(--bar-line); background: #1e252a; color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--hivis); }
.btn.on { background: var(--hivis); color: #111; border-color: var(--hivis); }
.btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--hivis); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 320px; min-width: 0; }
.chip { font: 500 .74rem var(--mono); padding: 5px 8px; border-radius: 3px; border: 1px solid var(--bar-line); background: transparent; color: var(--muted); cursor: pointer; }
.chip.on { color: #111; background: var(--text); border-color: var(--text); }
.time { font: 500 .78rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.prog { flex-basis: 100%; height: 3px; background: var(--bar-line); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--hivis); }
.hint { color: var(--muted); font-size: .8rem; margin: 0; }
.hint kbd { font: 500 .72rem var(--mono); border: 1px solid var(--bar-line); border-radius: 3px; padding: 1px 5px; color: var(--text); }

/* world */
.lane { stroke: #e2ac0b; stroke-width: 9; fill: none; opacity: .82; }
.tape { fill: none; stroke: url(#tapeStripe); stroke-width: 10; opacity: .9; }
.zone-w { fill: url(#gW); stroke: #d99a00; stroke-width: 3; stroke-dasharray: 14 10; }
.zone-d { fill: url(#gD); stroke: #d42d1b; stroke-width: 3; }
.zlab { font: 600 19px var(--mono); fill: #3d474d; letter-spacing: .03em; }
.pulse { fill: none; stroke: #1f2a31; stroke-width: 2.5; }
.mname { font: 800 28px var(--display); letter-spacing: .09em; fill: #1a2024; }
.tagt { font: 700 23px var(--display); letter-spacing: .06em; fill: #fff; }
.samlab { font: 700 24px var(--display); letter-spacing: .05em; fill: #1a2024; paint-order: stroke; stroke: rgba(230,232,228,.85); stroke-width: 6px; }

/* hud */
.lt-band { fill: #111518; fill-opacity: .92; }
.lt-tag { font: 600 22px var(--mono); fill: #ffc20e; letter-spacing: .08em; }
.lt-head { font: 800 64px var(--display); fill: #fff; letter-spacing: .01em; }
.lt-sub { font: 500 30px var(--body); fill: #d5dcdf; }
.stat-n { font: 800 170px var(--display); fill: #e2321f; }
.stat-l { font: 600 28px var(--body); fill: #111518; }
.stat-s { font: 500 22px var(--mono); fill: #5b666c; }
.card { fill: #111518; fill-opacity: .95; }
.card-h { font: 700 26px var(--display); letter-spacing: .1em; fill: #9aa6ac; }
.card-r { font: 600 26px var(--body); fill: #eef1f2; }
.pill-t { font: 600 19px var(--mono); }
.cd-n { font: 800 64px var(--display); fill: #fff; }
.cd-l { font: 600 18px var(--mono); fill: #9aa6ac; letter-spacing: .06em; }
.ban-h { font: 800 34px var(--display); letter-spacing: .04em; }
.ban-s { font: 500 22px var(--body); fill: #d5dcdf; }
.btn-t { font: 700 26px var(--body); }
.title-bg, .end-bg { fill: #111518; }
.t-big { font: 800 210px var(--display); letter-spacing: .02em; fill: #fff; }
.t-sub { font: 500 40px var(--body); fill: #c9d1d5; }
.t-name { font: 800 48px var(--display); fill: #fff; letter-spacing: .02em; }
.t-num { font: 600 22px var(--mono); fill: #ffc20e; }
#notes { background: var(--bar); border: 1px solid var(--bar-line); border-radius: 6px; padding: 12px 14px; }
#notes[hidden] { display: none; }
#notes .who { font: 600 .78rem var(--mono); color: var(--hivis); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; }
#notes .say { font: 500 1.05rem/1.45 var(--body); color: var(--text); margin: 0; max-width: 70ch; }
#notes .nxt { font: 500 .85rem var(--body); color: var(--muted); margin: 8px 0 0; }
#shell:fullscreen #notes { display: none; }
.t-small { font: 600 24px var(--mono); fill: #ffc20e; letter-spacing: .12em; }
.e-line { font: 700 58px var(--display); fill: #fff; }
.e-small { font: 500 26px var(--body); fill: #9aa6ac; }
.s-head { font: 800 96px var(--display); fill: #fff; letter-spacing: .01em; }
.s-pt { font: 500 34px var(--body); fill: #d5dcdf; }
.f-col { font: 600 22px var(--mono); letter-spacing: .12em; }
.f-name { font: 700 34px var(--display); fill: #fff; letter-spacing: .02em; }
.f-desc { font: 500 24px var(--body); fill: #b9c2c6; }
</style>

<div id="shell">
  <div id="stageWrap">
    <svg id="world" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
        <pattern id="tapeStripe" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="24" height="24" fill="#f2b705"/><rect width="12" height="24" fill="#1d2226"/>
        </pattern>
        <pattern id="hazard" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="22" height="22" fill="#f2b705"/><rect width="11" height="22" fill="#1d2226"/>
        </pattern>
        <pattern id="ribs" width="14" height="84" patternUnits="userSpaceOnUse">
          <rect width="14" height="84" fill="#25292c"/><rect width="3" height="84" fill="#33393d"/><rect x="3" width="1" height="84" fill="#1b1e20"/>
        </pattern>
        <pattern id="bricks" width="14" height="10" patternUnits="userSpaceOnUse">
          <rect width="14" height="10" fill="#9c4a35"/><rect x="1" y="1" width="12" height="4" fill="#b85a40"/><rect x="-6" y="6" width="12" height="3" fill="#ad5139"/><rect x="8" y="6" width="12" height="3" fill="#b3573e"/>
        </pattern>
        <linearGradient id="steelH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b6bd"/><stop offset=".45" stop-color="#6c7b84"/><stop offset=".55" stop-color="#55636b"/><stop offset="1" stop-color="#8d9ba3"/></linearGradient>
        <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a9b6bd"/><stop offset=".45" stop-color="#6c7b84"/><stop offset=".55" stop-color="#55636b"/><stop offset="1" stop-color="#8d9ba3"/></linearGradient>
        <linearGradient id="beamY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c533"/><stop offset=".5" stop-color="#d9a40a"/><stop offset="1" stop-color="#b98a05"/></linearGradient>
        <linearGradient id="beamYV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c533"/><stop offset=".5" stop-color="#d9a40a"/><stop offset="1" stop-color="#b98a05"/></linearGradient>
        <linearGradient id="roller" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#59666e"/><stop offset=".5" stop-color="#c4cfd5"/><stop offset="1" stop-color="#4b575e"/></linearGradient>
        <linearGradient id="cardboard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7a467"/><stop offset="1" stop-color="#b17c42"/></linearGradient>
        <linearGradient id="motor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e6fa8"/><stop offset="1" stop-color="#244a78"/></linearGradient>
        <radialGradient id="hat" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff2a8"/><stop offset=".35" stop-color="#ffd21f"/><stop offset="1" stop-color="#c99300"/></radialGradient>
        <linearGradient id="vestG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9b2e"/><stop offset="1" stop-color="#e35f00"/></linearGradient>
        <radialGradient id="drum" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#4f8fd6"/><stop offset="1" stop-color="#1b4675"/></radialGradient>
        <radialGradient id="gW" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#ffc20e" stop-opacity=".26"/><stop offset="1" stop-color="#ffc20e" stop-opacity=".07"/></radialGradient>
        <radialGradient id="gD" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#e2321f" stop-opacity=".34"/><stop offset="1" stop-color="#e2321f" stop-opacity=".14"/></radialGradient>
        <radialGradient id="lightPool" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffbe8" stop-opacity=".22"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/></radialGradient>
      </defs>

      <rect x="-300" y="-300" width="2300" height="1500" fill="#c6c8c3"/>
      <image id="floorImg" x="-200" y="-150" width="2100" height="1200" preserveAspectRatio="none"/>

      <!-- painted markings -->
      <path d="M -200 132 L 1800 132" class="lane"/><path d="M -200 168 L 1800 168" class="lane" opacity=".5"/>
      <path d="M -200 846 L 1800 846" class="lane"/><path d="M -200 882 L 1800 882" class="lane" opacity=".5"/>
      <rect x="330" y="420" width="620" height="176" rx="4" class="tape" opacity=".55"/>
      <rect x="1074" y="190" width="272" height="228" rx="4" class="tape"/>

      <!-- scenery (static) -->
      <g id="scenery">
        <!-- drywall stack -->
        <rect x="98" y="214" width="184" height="112" rx="3" fill="#000" opacity=".28" filter="url(#soft)" transform="translate(10 12)"/>
        <rect x="96" y="210" width="184" height="112" rx="3" fill="#8f7454"/>
        <rect x="100" y="206" width="176" height="108" rx="2" fill="#d9d6cd"/>
        <rect x="104" y="202" width="168" height="104" rx="2" fill="#e9e7e0"/>
        <path d="M104 236 H272 M104 270 H272" stroke="#c9c6bd" stroke-width="2"/>
        <rect x="140" y="198" width="8" height="112" fill="#3a3f43"/><rect x="226" y="198" width="8" height="112" fill="#3a3f43"/>
        <!-- cement bags on pallet -->
        <rect x="312" y="232" width="128" height="100" rx="3" fill="#000" opacity=".26" filter="url(#soft)" transform="translate(9 11)"/>
        <rect x="310" y="230" width="128" height="100" rx="2" fill="#9b7a52"/>
        <g fill="#d4c8aa" stroke="#b3a684" stroke-width="2">
          <rect x="316" y="236" width="56" height="28" rx="9"/><rect x="376" y="236" width="56" height="28" rx="9"/>
          <rect x="316" y="268" width="56" height="28" rx="9"/><rect x="376" y="268" width="56" height="28" rx="9"/>
          <rect x="316" y="300" width="56" height="26" rx="9"/><rect x="376" y="300" width="56" height="26" rx="9"/>
        </g>
        <!-- drums -->
        <g id="drums"></g>
        <!-- cones -->
        <g id="cones"></g>
      </g>

      <g id="zones"></g>

      <!-- Conveyor -->
      <g id="conv">
        <rect x="336" y="452" width="566" height="122" rx="6" fill="#000" opacity=".32" filter="url(#soft)" transform="translate(12 16)"/>
        <!-- drive motor -->
        <rect x="330" y="488" width="56" height="50" rx="6" fill="url(#motor)"/>
        <path d="M338 494 V532 M346 494 V532 M354 494 V532 M362 494 V532" stroke="#1c3a5e" stroke-width="2"/>
        <rect x="370" y="482" width="22" height="62" rx="3" fill="#f2b705"/>
        <path d="M330 540 C 300 580 290 610 250 640" stroke="#1a1d1f" stroke-width="5" fill="none"/>
        <!-- frame rails -->
        <rect x="388" y="452" width="510" height="16" rx="3" fill="url(#steelH)"/>
        <rect x="388" y="552" width="510" height="16" rx="3" fill="url(#steelH)"/>
        <!-- belt -->
        <rect x="406" y="468" width="474" height="84" fill="url(#ribs)" id="belt"/>
        <rect x="406" y="468" width="474" height="84" fill="url(#beltShade)"/>
        <!-- end rollers -->
        <rect x="392" y="466" width="16" height="88" rx="6" fill="url(#roller)"/>
        <rect x="878" y="466" width="16" height="88" rx="6" fill="url(#roller)"/>
        <g id="boxes"></g>
        <!-- bolts -->
        <g fill="#38444b" id="bolts"></g>
        <!-- e-stop -->
        <rect x="846" y="566" width="30" height="24" rx="3" fill="#f2b705"/><circle cx="861" cy="578" r="8" fill="#c8231a"/><circle cx="859" cy="576" r="3" fill="#ff8a7d"/>
        <text x="640" y="404" text-anchor="middle" class="mname">CONVEYOR</text>
      </g>

      <!-- Hoist (overhead gantry, top-down) -->
      <g id="hoist">
        <rect x="1088" y="202" width="246" height="204" fill="#000" opacity=".22" filter="url(#soft)" transform="translate(16 20)"/>
        <g id="hoistLoad">
          <rect id="loadShadow" x="-34" y="-28" width="68" height="56" rx="4" fill="#000" opacity=".3" filter="url(#soft2)"/>
          <g id="loadBody">
            <rect x="-32" y="-26" width="64" height="52" rx="2" fill="#a37548"/>
            <path d="M-32 -16 H32 M-32 0 H32 M-32 16 H32" stroke="#7d5833" stroke-width="2"/>
            <rect x="-28" y="-22" width="56" height="44" fill="url(#bricks)"/>
            <path d="M-6 -24 V24 M-30 -2 H30" stroke="#2b3034" stroke-width="2.5"/>
          </g>
        </g>
        <!-- runway beams -->
        <rect x="1094" y="200" width="20" height="210" fill="url(#beamYV)"/><rect x="1102" y="200" width="4" height="210" fill="#8e6a04"/>
        <rect x="1306" y="200" width="20" height="210" fill="url(#beamYV)"/><rect x="1314" y="200" width="4" height="210" fill="#8e6a04"/>
        <!-- columns -->
        <g id="cols"></g>
        <!-- bridge + trolley (moved by script) -->
        <g id="bridge">
          <rect x="1090" y="-14" width="240" height="28" fill="url(#beamY)"/>
          <rect x="1090" y="-3" width="240" height="6" fill="#8e6a04"/>
          <rect x="1086" y="-18" width="16" height="36" rx="3" fill="#3b464c"/><rect x="1318" y="-18" width="16" height="36" rx="3" fill="#3b464c"/>
          <g id="trolley">
            <rect x="-22" y="-24" width="44" height="48" rx="4" fill="#3d4a52"/>
            <rect x="-16" y="-18" width="32" height="36" rx="3" fill="#56656e"/>
            <circle r="9" fill="#2a3237"/><circle r="4" fill="#9aa8b0"/>
          </g>
        </g>
        <text x="1210" y="176" text-anchor="middle" class="mname">HOIST</text>
      </g>

      <!-- sensor boxes, pulses, tags (filled by script) -->
      <g id="sensors"></g>
      <g id="tags"></g>

      <!-- Sam -->
      <g id="sam">
        <ellipse id="samShadow" rx="36" ry="22" fill="#000" opacity=".25" filter="url(#soft2)" cx="6" cy="8"/>
        <g id="samRing"><circle id="ringOut" r="58" fill="none" stroke-width="4"/></g>
        <g id="samBody">
          <ellipse id="bootL" cx="-11" cy="0" rx="8" ry="13" fill="#2b2f33"/>
          <ellipse id="bootR" cx="11" cy="0" rx="8" ry="13" fill="#2b2f33"/>
          <g id="armL"><ellipse cx="-29" cy="1" rx="9" ry="19" fill="#2c3e5a"/><circle cx="-29" cy="-17" r="7" fill="#c48a64"/></g>
          <g id="armR"><ellipse cx="29" cy="1" rx="9" ry="19" fill="#2c3e5a"/>
            <circle id="strapGlow" cx="30" cy="-6" r="12" filter="url(#glow)" opacity=".8"/>
            <rect x="21" y="-11" width="18" height="10" rx="3" fill="#15191c"/><circle id="strap" cx="30" cy="-6" r="3.6"/>
            <circle cx="29" cy="-17" r="7" fill="#c48a64"/></g>
          <ellipse rx="27" ry="17" fill="url(#vestG)"/>
          <path d="M-22 -7 Q0 -11 22 -7 M-23 7 Q0 11 23 7" stroke="#e8eef1" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M-8 -16 V16 M8 -16 V16" stroke="#e8eef1" stroke-width="3" opacity=".8"/>
          <ellipse cx="0" cy="-2" rx="18" ry="17" fill="#b88a00"/>
          <circle r="15" fill="url(#hat)"/>
          <path d="M0 -14 V14" stroke="#c99300" stroke-width="3" opacity=".7"/>
        </g>
        <g id="samDown" opacity="0">
          <ellipse cx="-58" cy="-10" rx="16" ry="8" fill="#2b2f33"/><ellipse cx="-56" cy="12" rx="16" ry="8" fill="#2b2f33"/>
          <rect x="-50" y="-16" width="30" height="13" rx="6" fill="#2f3b48"/><rect x="-48" y="3" width="30" height="13" rx="6" fill="#2f3b48"/>
          <ellipse cx="2" cy="0" rx="30" ry="20" fill="url(#vestG)"/>
          <path d="M-10 -18 V18 M10 -18 V18" stroke="#e8eef1" stroke-width="4"/>
          <ellipse cx="14" cy="-30" rx="20" ry="8" fill="#2c3e5a" transform="rotate(-30 14 -30)"/>
          <ellipse cx="18" cy="30" rx="20" ry="8" fill="#2c3e5a" transform="rotate(30 18 30)"/>
          <circle id="strapGlowDown" cx="32" cy="38" r="12" filter="url(#glow)" opacity=".8"/>
          <rect x="24" y="33" width="16" height="10" rx="3" fill="#15191c"/><circle id="strapDown" cx="32" cy="38" r="3.6"/>
          <circle cx="44" cy="0" r="16" fill="url(#hat)"/>
        </g>
        <g id="burst" opacity="0"></g>
        <text id="samLab" y="96" text-anchor="middle" class="samlab">SAM</text>
      </g>

      <!-- overhead lighting -->
      <ellipse cx="640" cy="520" rx="520" ry="360" fill="url(#lightPool)" pointer-events="none"/>
      <ellipse cx="1210" cy="330" rx="440" ry="320" fill="url(#lightPool)" pointer-events="none"/>
    </svg>

    <svg id="hud" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="55%" stop-color="#e2321f" stop-opacity="0"/><stop offset="100%" stop-color="#e2321f" stop-opacity=".55"/></radialGradient>
        <radialGradient id="edge" cx="50%" cy="48%" r="72%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".38"/></radialGradient>
        <linearGradient id="beltShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".2" stop-color="#000" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#edge)"/>
      <rect id="vignette" width="1600" height="900" fill="url(#vig)" opacity="0"/>


      <!-- supervisor card -->
      <g id="card" opacity="0">
        <rect x="1060" y="56" width="484" height="560" rx="12" class="card"/>
        <text x="1092" y="104" class="card-h">SUPERVISOR · NEARSTOP HUB</text>
        <g id="cardRows"></g>
        <rect id="ban" x="1092" y="300" width="420" height="132" rx="8"/>
        <text id="banH" x="1114" y="346" class="ban-h"></text>
        <text id="banS1" x="1114" y="382" class="ban-s"></text>
        <text id="banS2" x="1114" y="412" class="ban-s"></text>

          <text x="120" y="140" class="t-small">THE PROBLEM</text>
          <text x="114" y="250" class="s-head">Machines can't tell when</text>

          <rect x="120" y="390" width="120" height="10" fill="#ffc20e"/>
          <rect x="120" y="453" width="16" height="16" fill="#ffc20e"/>
          <text x="160" y="472" class="s-pt">A worker who falls beside a running machine can be hurt again by it.</text>
          <rect x="120" y="521" width="16" height="16" fill="#ffc20e"/>
          <text x="160" y="540" class="s-pt">On a busy site, a fall can go unnoticed for minutes.</text>

          <text x="160" y="608" class="s-pt">Heat, flammable gas and pressure changes give the worker no warning.</text>

<script>
(() => {
  const END = 45;
  const DT = 0.01;
  const WARN = 200, DANGER = 66;                 // 150 cm and 50 cm at this drawing's scale
  const S = { conv: [640, 568], hoist: [1210, 418] };   // sensor positions (both face down the page)
  const TF = 25, TC = 26.3, TOK = 31, TUP = 34, TA = 37.5, TEND = 39;  // impact, confirmed (+1.3 s), supervisor check-in, stands, approve, end card

  const KEYS = [[0,160,720],[4.5,160,720],[9,160,720],[11.8,640,740],[13.2,640,690],[16,640,690],
                [18.6,1000,690],[20.6,1210,478],[TUP,1210,478],[36.2,880,590],[END,880,590]];
  const ease = u => u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
  function samAt(t) {
    for (let i = 0; i < KEYS.length - 1; i++) {
      const [t0,x0,y0] = KEYS[i], [t1,x1,y1] = KEYS[i+1];
      if (t <= t1) { const u = t1 === t0 ? 1 : ease(Math.min(1, Math.max(0, (t-t0)/(t1-t0)))); return [x0+(x1-x0)*u, y0+(y1-y0)*u]; }
    }
    return KEYS[KEYS.length-1].slice(1);
  }
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const zoneOf = d => d <= DANGER ? 2 : d <= WARN ? 1 : 0;

  // Simulate NearStop's v2 rules once, so every frame and every jump agrees.
  // Presence never stops the Conveyor or the Hoist; a hit within the Hoist's 50 cm holds it, the confirmed fall locks it.
  const N = Math.round(END/DT) + 1, sim = new Array(N);
  let st = { conv:'run', hoist:'run' }, approved = false, ang = 0, convNearT = null, hoistNearT = null;
  for (let i = 0; i < N; i++) {
    const t = i*DT, p = samAt(t), q = samAt(t + .05);
    const mv = Math.hypot(q[0]-p[0], q[1]-p[1]);
    if (mv > .05) ang = Math.atan2(q[1]-p[1], q[0]-p[0]) * 180/Math.PI + 90;
    const z = { conv: zoneOf(dist(p,S.conv)), hoist: zoneOf(dist(p,S.hoist)) };
    const clear = !z.conv && !z.hoist;
    if (!approved && t >= TA && clear) { for (const k in st) if (st[k]==='lock') st[k]='run'; approved = true; }
    if (convNearT === null && z.conv >= 1) convNearT = t;
    if (hoistNearT === null && z.hoist === 2) hoistNearT = t;
    if (t >= TF && t < TC && z.hoist === 2) st.hoist = 'hold';
    if (t >= TC && st.hoist === 'hold') st.hoist = 'lock';
    sim[i] = { ...st, zone: Math.max(z.conv, z.hoist), p, ang, moving: mv > .05 };
  }

  const CAPS = [
    [4,   "01 · THE SITE", "Consider a workshop", "A conveyor, a hoist and one worker, Sam, wearing the NearStop strap."],
    [convNearT, "02 · CONVEYOR", "Sam works close to the conveyor. It keeps running.", "Being near a machine is normal work. Presence alone never stops it."],
    [16,  "03 · THE HOIST", "Sam walks over to the hoist", "Up close the strap turns red, and the hoist keeps lifting."],
    [hoistNearT + 1, "03 · THE HOIST", "Standing near the hoist is fine", "It stops only if Sam falls near it."],
    [TF,  "04 · FALL", "Sam falls next to the hoist", "The strap feels the hit and NearStop holds the hoist instantly."],
    [TC,  "04 · FALL CONFIRMED", "Hoist locked out", "Sam lay still, so the fall is real. A 10-second check-in starts; no answer means SOS."],
    [TOK, "05 · CHECK-IN", "The supervisor confirms Sam is OK", "No SOS. The hoist stays locked: someone who fell can still be hurt."],
    [TUP, "06 · AREA CLEAR", "Sam walks away from the hoist", "Restart is refused while anyone is still in a zone."],
    [TA,  "06 · RESTART", "A supervisor approves the restart", "Only a person brings a locked machine back."],
  ];
  // ---- the five speakers, one minute each. Each step plays up to its hold time `t`, then waits for the next click.
  const TEAM = ['Ashik Hredoy', 'Rafat Islam', 'Sepehr Ghafouri', 'Zeeshan Haque', 'Hamza Razzak'];   // speaking order
  const TTY = 42.5;   // thank-you card
  const STEPS = [
    { t: 1,    who: 0, name: 'Title and team', say: "Hi, we're NearStop. Introduce the team by name, then click to the problem." },
    { t: 1,    who: 0, name: 'The problem', slide: 'problem', say: "Machines on a work site can't tell when a worker near them is in trouble. If someone falls beside a running machine it keeps going, and on a busy site nobody may notice for minutes. Heat, flammable gas and pressure changes give no warning either. In Canada, nearly 49,000 workers a year are hurt badly enough by falls to miss work: 48,891 lost-time claims and 63 deaths in 2017, making falls the third most common lost-time claim (Association of Workers' Compensation Boards of Canada). And the longer a worker waits for help, the worse an injury can get." },
    { t: 1,    who: 1, name: 'The product', slide: 'features', say: "Our strap, worn on the upper arm. Yellow = machine safety: brain and radio, motion sensor, speaker, 'I'm OK' button. Green = worker conditions: gas sensor, temperature and pressure sensor." },
    { t: 8.5,  who: 2, name: 'Consider a workshop', say: "Consider a workshop: a conveyor and a hoist, each with an ESP32 and an ultrasonic sensor. Sam wears our strap. Everything reports to the NearStop hub on a laptop." },
    { t: 15.5, who: 2, name: 'Conveyor', say: "The strap sends a radio beacon, so a machine knows it's Sam and not a box. Working next to a machine is normal, so presence alone never stops the conveyor." },
    { t: 23.5, who: 2, name: 'Hoist', say: "Same at the hoist: Sam can stand right beside it and it keeps lifting. A system that stops for every step gets switched off; ours only acts when something is wrong." },
    { t: 25.8, who: 3, name: 'The fall', say: "Sam falls near the hoist. The strap feels the hit and NearStop holds the hoist right away." },
    { t: 29,   who: 3, name: 'Lockout', say: "About a second later the strap confirms the fall (Sam lies still), so the hold becomes a lockout. A 10-second check-in starts on the dashboard; no answer means SOS." },
    { t: 33,   who: 3, name: 'Check-in', say: "A supervisor answers the check-in on the dashboard: Sam is OK, no SOS. The hoist stays locked, because someone who fell can still be hurt." },
    { t: 36.3, who: 4, name: 'Area clear', say: "Sam gets up and walks out of the zone. Restart is refused while anyone is still in a zone, so NearStop waits until the area is clear." },
    { t: 38.4, who: 4, name: 'Restart', say: "Now the area is clear, the supervisor approves the restart and the hoist goes back to work. Only a person brings a locked machine back." },
    { t: 41,   who: 4, name: 'Why it matters', say: "Wrap up: NearStop tells you the conditions of a worker and ensures their safety. It adds to e-stops and lockout/tagout, never replaces them." },
    { t: 44.5, who: 4, name: 'Thank you', say: "Thank the audience and invite questions." },
  ];

  // camera keyframes: time, x, y, w   (h = w * 9/16)
  const CAM = [[0,0,0,1600],[9,0,0,1600],[10.8,110,330,1000],[15.6,110,330,1000],[18.4,660,150,1000],[24.2,660,150,1000],
               [25.1,720,190,1000],[TEND,720,190,1000],[TEND+.8,0,0,1600],[END,0,0,1600]];
  function camAt(t) {
    for (let i = 0; i < CAM.length-1; i++) {
      const a = CAM[i], b = CAM[i+1];
      if (t <= b[0]) { const u = b[0]===a[0] ? 1 : ease(Math.min(1, Math.max(0, (t-a[0])/(b[0]-a[0])))); return [a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u, a[3]+(b[3]-a[3])*u]; }

    const left = Math.max(0, 10 - (t - TC));
    $('cdN').textContent = Math.ceil(left);
    $('cdArc').setAttribute('stroke-dashoffset', (276.5 * (1 - left/10)).toFixed(1));
    const ready = t >= 36.2;
    const pressed = t >= TA && t < TA + .5;
    $('apBtn').setAttribute('fill', pressed ? '#ffc20e' : t >= TA ? '#1f9d55' : 'none');
    $('apBtn').setAttribute('stroke', ready ? '#ffc20e' : '#3b4a54');
    $('apTxt').setAttribute('fill', pressed ? '#111' : t >= TA ? '#fff' : ready ? '#ffc20e' : '#5b666c');
    $('apTxt').textContent = t >= TA + .5 ? 'Restart approved' : 'Approve restart';
    // cursor: first answers the check-in on the banner (the strap has no button), later approves the restart
    const okPress = t >= TOK && t < TOK + .4;
    if (t >= TOK - 1.4 && t < TOK + .8) {
      const u = fade(TOK - 1.4, TOK - .1, t);
      $('cursor').setAttribute('opacity', 1);
      $('cursor').setAttribute('transform', `translate(${(1530 - u*230).toFixed(1)} ${(660 - u*290).toFixed(1)}) scale(${okPress ? .9 : 1})`);
    } else {
      const cu = fade(36.4, TA - .1, t);
      $('cursor').setAttribute('opacity', t >= 36.4 && t < TA + 1.2 ? 1 : 0);
      $('cursor').setAttribute('transform', `translate(${(1530 - cu*220).toFixed(1)} ${(660 - cu*150).toFixed(1)}) scale(${pressed ? .9 : 1})`);
    }
    const rip = fade(TA, TA + .7, t);
    $('ripple').setAttribute('r', (rip * 120).toFixed(1)); $('ripple').setAttribute('opacity', t >= TA && t < TA + .7 ? 1 - rip : 0);

    // lower third
    let cap = null; for (const c of CAPS) if (t >= c[0]) cap = c;
    const ltOn = cap && t >= 4 && t < TEND;
    $('lt').setAttribute('opacity', ltOn ? fade(4, 4.5, t) * (1 - fade(TEND-.4, TEND, t)) : 0);
    if (cap && $('ltHead').textContent !== cap[2]) { $('ltTag').textContent = cap[1]; $('ltHead').textContent = cap[2]; $('ltSub').textContent = cap[3]; }

    // controls + speaker notes
    const st = STEPS[cur], atHold = t >= st.t - 1e-3;
    $('time').textContent = `Step ${cur + 1}/${STEPS.length} · ${TEAM[st.who].split(' ')[0]}${classMode && atHold ? ' · waiting' : ''}`;
    $('prog').style.width = (t/END*100).toFixed(2) + '%';
    [...$('chips').children].forEach((c, w) => c.classList.toggle('on', w === st.who));
    if (notesFor !== cur) {
      notesFor = cur;
      $('notesWho').textContent = `${TEAM[st.who]} · speaker ${st.who + 1} of ${TEAM.length} · step ${cur + 1}: ${st.name}`;
      $('notesSay').textContent = st.say;
      const nx = STEPS[cur + 1];
      $('notesNext').textContent = nx ? `Next click: ${nx.name}${nx.who !== st.who ? ` (hand over to ${TEAM[nx.who].split(' ')[0]})` : ''}` : 'Last step.';
    }
  }
  let notesFor = -1;

  function frame(now) {
    const dt = paused || last === null ? 0 : Math.min(.1, (now - last) / 1000);
    last = now;
    A += dt;
    if (classMode) {
      const tgt = STEPS[cur].t;
      if (t < tgt) { t = REDUCE ? tgt : Math.min(tgt, t + dt); heldFor = 0; } else heldFor += dt;
    } else {
      t += dt; heldFor = 0;
      if (t >= END) { t = 0; ph = { conv:0, hoist:0 }; }
      cur = stepAt(t);
    }
    render(dt);
    requestAnimationFrame(frame);
  }

  function syncButtons() {
    $('mode').classList.toggle('on', !classMode);
    $('pause').classList.toggle('on', paused); $('pause').textContent = paused ? 'Resume' : 'Pause';
  }
  function next() {
    if (!classMode) { goStep(Math.min(STEPS.length - 1, stepAt(t) + 1)); return; }
    if (t < STEPS[cur].t - .01) { t = STEPS[cur].t; return; }          // still playing: finish this part now
    if (cur < STEPS.length - 1) { cur++; heldFor = 0; paused = false; syncButtons(); }
  }
  function prev() {
    if (!classMode) { goStep(Math.max(0, stepAt(t) - 1)); return; }
    cur = Math.max(0, cur - (t >= STEPS[cur].t - .01 ? 1 : 0));            // back to the previous hold, shown at once
    t = STEPS[cur].t; heldFor = 3; render(0);
  }
  function toggleNotes() {
    const n = $('notes'); n.hidden = !n.hidden; $('notesBtn').classList.toggle('on', !n.hidden);
    try { localStorage.setItem('nearstop-notes', n.hidden ? '0' : '1'); } catch (e) {}
  }
  try { if (localStorage.getItem('nearstop-notes') === '1') toggleNotes(); } catch (e) {}

  $('next').addEventListener('click', next);
  $('back').addEventListener('click', prev);
  $('pause').addEventListener('click', () => { paused = !paused; syncButtons(); });
  $('notesBtn').addEventListener('click', toggleNotes);
  $('mode').addEventListener('click', () => {
    classMode = !classMode;
    if (classMode) { cur = stepAt(t); }
    syncButtons();
  });
  const shell = $('shell');
  function toggleFs() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else shell.requestFullscreen().catch(() => {});
    } catch (e) {}
  }
  $('fs').addEventListener('click', toggleFs);
  document.addEventListener('fullscreenchange', () => { $('fs').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
  let idle;
  shell.addEventListener('pointermove', () => { shell.classList.add('active'); clearTimeout(idle); idle = setTimeout(() => shell.classList.remove('active'), 2000); });
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const onButton = e.target.closest && e.target.closest('button');
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown' || ((e.key === ' ' || e.key === 'Enter') && !onButton)) { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp' || e.key === 'Backspace') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { e.preventDefault(); goStep(0); }
    else if (e.key === 'f' || e.key === 'F') toggleFs();
    else if (e.key === 'n' || e.key === 'N') toggleNotes();
    else if (e.key === 'p' || e.key === 'P') { paused = !paused; syncButtons(); }
  });

  // ?step=N opens at step N, already held there (for rehearsing one speaker's part)
  const qs = Number(new URLSearchParams(location.search).get('step'));
  if (qs >= 1 && qs <= STEPS.length) { cur = qs - 1; t = STEPS[cur].t; heldFor = 3; }

  syncButtons();
  render(0);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
